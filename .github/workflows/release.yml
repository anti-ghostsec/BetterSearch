name: Release

# Tag a version (`git tag v0.1.0 && git push --tags`) and GitHub builds,
# tests and attaches the binary. The tag is the version the binary reports.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A re-pushed tag cancels its own earlier build instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    # The sign-in window needs GTK 4.18 and WebKitGTK 2.52, newer than Ubuntu
    # LTS has; Debian 13 has both.
    container: debian:trixie
    steps:
      # eframe needs the X11 and GL headers even for a headless build, and the
      # sign-in window GTK's and WebKit's. Before checkout, so it can use git.
      - name: Libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git build-essential pkgconf \
            libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      # Nothing ships unless it is clean and passing.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -e
          name="bettersearch-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name"
          install -m 0755 target/release/bettersearch "dist/$name/"
          install -m 0644 README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
