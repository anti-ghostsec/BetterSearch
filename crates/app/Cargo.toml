[package]
name = "bettersearch"
version = "0.1.4"
edition = "2024"
description = "A desktop booru search with real boolean searches, tags and local learning"
repository = "https://github.com/anti-ghostsec/BetterSearch"
license = "MIT"

[dependencies]
bettersearch-core = { version = "0.1.0", path = "../core" }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links", "accesskit", "system_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
zeroize = "1.9.1"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
