[package]
name = "bettersearch-core"
version = "0.1.15"
edition = "2024"
description = "A desktop booru search with real boolean searches, tags and local learning"
repository = "https://github.com/anti-ghostsec/BetterSearch"
license = "MIT"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = "1.9.1"
